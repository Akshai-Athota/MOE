[project]
name = "hackthonmoe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "langchain-core>=1.8.4",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.24",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# Voice-clone avatar (optional, large: PyTorch + XTTS-v2). Install with: uv sync --extra avatar
# XTTS-v2 model licence (CPML) allows non-commercial use only -> fine for the hackathon demo.
[project.optional-dependencies]
avatar = [
    "coqui-tts>=0.27.0",
    "six>=1.17.0",
    "torch>=2.4",
    "torchaudio>=2.4",
]

# PyPI only has CPU builds of PyTorch for Windows: take CUDA builds from the PyTorch index
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
