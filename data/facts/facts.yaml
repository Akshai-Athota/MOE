  - id: F007
    category: org
    topic: Zusammenarbeit der Bereiche
    de: "Arbeitnehmerbereich und Rechtsbehelfsstelle arbeiten am engsten zusammen: Geht ein Einspruch ein, prüft zuerst die Veranlagung, ob abgeholfen werden kann; erst dann geht die Akte an die Rechtsbehelfsstelle. Die Servicestelle leitet Bürgeranliegen an den Arbeitnehmerbereich weiter."
    en: "Employee tax and appeals work closest: assessment checks first whether to grant the objection, then hands the file to appeals."
