    question_ids: [Q05]
    sources_planned: [doc]

  - id: F005
    category: org
    topic: Vertretungsplan Ablage
    de: "Der Vertretungsplan liegt unter S:\\Amt\\Organisation\\Vertretungsplan.xlsx und wird von der Geschäftsstelle gepflegt. Urlaube über drei Tage müssen dort zusätzlich eingetragen werden."
    en: "The deputy plan lives on S:\\Amt\\Organisation and is maintained by central services; leave over 3 days must be entered there."
    owner: p05
    also_known_by: [p08]
    department: GS
    access: internal
