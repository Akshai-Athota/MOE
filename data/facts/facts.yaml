    topic: Wann Datenschutz einbinden
    de: "Die Datenschutzkoordination (Anja Vogt, Raum 1.07) ist einzubinden bei neuen IT-Verfahren oder Tools, eigenen Listen mit Personenbezug, Weitergabe von Daten an Dritte und Fotos oder Videos von Beschäftigten."
