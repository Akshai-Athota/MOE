    de: "Berichte an das LStN: Entwurf im Sachgebiet, Mitzeichnung durch die Sachgebietsleitung, Formalprüfung durch die Geschäftsstelle, Zeichnung durch die Vorsteherin. Bei rechtlichen Grundsatzfragen zeichnet die Rechtsbehelfsstelle mit."
