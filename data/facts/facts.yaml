    sources_planned: [doc, interview, image]

  - id: F002
    category: org
    topic: Organigramm
    de: "Das Amt ist in drei Bereiche gegliedert: Rechtsbehelfsstelle (Leitung Jens Hartmann), Geschäftsstelle & Servicestelle (Leitung Wolfgang Reinecke) und Arbeitnehmerbereich (Leitung Petra Schulte). Alle drei berichten an die Vorsteherin."
    en: "Three units: appeals (Hartmann), central services (Reinecke), employee tax (Schulte); all report to the head."
    owner: p05
    also_known_by: [p01]
    department: ALL
    access: internal
    valid_from: 2022-01-01
    question_ids: [Q01, Q04]
    sources_planned: [image, doc]

  - id: F003
    category: org
    topic: Entscheidungsbefugnisse
    de: "Fachliche Entscheidungen trifft die jeweilige Sachgebietsleitung. Personal- und Organisationsentscheidungen trifft die Vorsteherin. Beschaffungen bis 25.000 € entscheidet die Leitung der Geschäftsstelle."
    en: "Unit heads decide on subject matter; the head decides HR/organisation; central services head decides purchases up to €25k."
    owner: p01
    also_known_by: [p05]
    department: ALL
    access: internal
    valid_from: 2025-01-01
    rule: HV-2025-02
    question_ids: [Q02]
    sources_planned: [interview, doc]

  - id: F004
    category: org
    topic: Vertretungsregeln
    de: "Vertretungen: Hartmann ↔ Demir, Demir ↔ Brandt, Reinecke → Krüger, Krüger → Reinecke, Lindner → Ahrens, Vogt (Personal) → Krüger, Ahrens → Vogt, Schulte → Meyer, Meyer ↔ Nowak. Neue Kolleginnen und Kollegen erhalten in den ersten sechs Monaten keine eigene Vertretungsfunktion."
    en: "Deputy pairs as listed; new hires have no deputy role in the first six months."
    owner: p05
    also_known_by: [p10]
    department: ALL
    access: internal
