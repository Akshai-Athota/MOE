    category: process
    topic: Datenpannen melden
    de: "Datenpannen müssen intern innerhalb von 24 Stunden an die Datenschutzkoordination gemeldet werden, damit die 72-Stunden-Frist nach Art. 33 DSGVO eingehalten wird."
    en: "Report data breaches internally within 24h so the GDPR 72h deadline holds."
