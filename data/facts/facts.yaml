  - id: F006
    category: org
    topic: Wer einzubinden ist
    de: "Einzubinden sind: der Personalrat bei Arbeitszeit, Einstellungen und neuer Technik; die Datenschutzkoordination bei neuen Tools und Listen mit Personenbezug; die Rechtsbehelfsstelle bei rechtlichen Grundsatzfragen; die Geschäftsstelle bei jeder Beschaffung."
    en: "Involve staff council (working time, hiring, new tech), data protection (new tools/lists), appeals (legal principles), central services (purchasing)."
    owner: p01
    also_known_by: [p08, p05]
    department: ALL
    access: internal
