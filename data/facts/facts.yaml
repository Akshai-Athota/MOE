  # =========================== PROCESS ===========================
  - id: F011
    category: process
    topic: Typischer Abstimmungsweg
    de: "Abstimmungen laufen immer zuerst mündlich mit der eigenen Sachgebietsleitung, dann als E-Mail-Entwurf, dann über die Mitzeichnung. Niemand geht ohne die Sachgebietsleitung direkt zur Vorsteherin."
    en: "Align verbally with your unit head first, then email draft, then co-signing; never go to the head directly."
