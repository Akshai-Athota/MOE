  # =========================== ORG ===========================
  - id: F001
    category: org
    topic: Amtsleitung und Vertretung
    de: "Das Finanzamt wird von der Vorsteherin Dr. Katrin Wöhler geleitet. Ihre ständige Vertreterin ist Petra Schulte, Sachgebietsleiterin Arbeitnehmerbereich."
    en: "The office is headed by Dr. Katrin Wöhler; her permanent deputy is Petra Schulte."
    owner: p01
    also_known_by: [p05, p10]
    department: AL
