# Farewell celebration ("Abschiedsfeier mit Q"): quiz bank + reward settings. ALL FICTIONAL.
# The UI's "Celebration" tab generates a quiz from this file (later: from live claims of the leaver).
#
# Idea: knowledge capture as a farewell ritual, not a documentation chore.
#   T-12 weeks  weekly 10-min story interviews  ->  T-2 weeks legacy booklet  ->  retirement day quiz.
#   funny questions: colleagues guess, the retiree reveals the story (keeps them in the spotlight).
#   gap questions:   nobody knows -> the retiree answers -> Q records it live as a new claim.
# Rules: every `funny` answer must come from a fact the leaver owns or knows (validator checks this);
#        every `gap` question must point to a planted gap whose who_to_ask is the leaver.

settings:
  modes:
    party: {audience: colleagues in teams, host: Q (screen + voice), duration_min: 20}
    solo:  {audience: retiree alone with Q, host: Q (chat or voice), duration_min: 15}
  mix: {funny: 3, gap: 1}           # after every 3 funny questions, one gap question
  scoring:
    teams: true                     # colleagues compete in teams; points only for colleagues
    retiree_points: false           # the retiree is never scored; they are the expert
  capture:
    gap_answers: record_audio       # live answer -> transcript -> claim (status: current)
    source_label_de: "Abschiedsquiz {leaver_name}, {date}, {time}"
    requires_confirmation: true     # retiree confirms the captured claim after the quiz
  ending:
    legacy_booklet: true            # "Wissen von {name}": PDF handbook generated from the leaver's claims
    lasting_credit: true            # Q keeps citing the leaver by name in future answers

rewards:
  principle: Anerkennung zuerst, Geschenk als Zeichen – keine Punkte für die Ruheständler.
  tax_fact: F106                    # €110 per participant incl. gifts ≤ €60 (R 19.3 Abs. 2 Nr. 3 LStR)
  max_gift_eur: 60
  # Suggestions use ONLY interests the person volunteered (persona.interests_consent.allowed_use).
  suggestions:
    p05:
      - {de: "Wanderführer 'Harzer Hexenstieg' + Einkehrgutschein", est_eur: 55, based_on: Wandern im Harz}
      - {de: "Gutschein Modellbahn-Fachhandel", est_eur: 50, based_on: Modelleisenbahn Spur H0}
    p11:
      - {de: "Gutschein Gartencenter", est_eur: 50, based_on: Kleingarten}
      - {de: "Radkarten-Set Weserradweg + Fahrradtasche", est_eur: 58, based_on: Radfahren auf dem Weserradweg}

leavers:
  p05: {name: Wolfgang Reinecke, last_day: 2027-01-31, mode: party}
  p11: {name: Hans-Jürgen Meyer, last_day: 2027-04-30, mode: solo}

